<!DOCTYPE html>
<html lang="en">
<head>
    <!-- PANGGIL LIBRARY SUPABASE RESMI VIA CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aircraft Parking System</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: #1e1e1e; /* Warna gelap agar layout menonjol */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            background-color: #111;
            width: 100%;
            padding: 15px 20px;
            box-sizing: border-box;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 10;
        }

        .header h2 {
            margin: 0;
            font-size: 20px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* INI ADALAH PAPAN LAYOUT UTAMA AGAR POSISI PESAWAT TERKUNCI */
        .parking-board {
            position: relative;
            width: 95vw;
            max-width: 1400px;
            aspect-ratio: 1472 / 670; /* Menyesuaikan rasio gambar asli */
            background-image: url('backgroundparking.png');
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            margin-top: 20px;
            border: 2px solid #555;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            border-radius: 8px;
        }

        .images-container {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100%;
            height: 100%;
        }

        .draggable-image {
            position: absolute;
            cursor: move;
            width: 4.5%; /* Ukuran dinamis agar pas di kotak Line / Hangar */
            min-width: 25px;
            height: auto;
            z-index: 10;
            transition: transform 0.1s;
            filter: drop-shadow(2px 4px 4px rgba(0, 0, 0, 0.6));
        }

        .draggable-image:hover {
            transform: scale(1.15) !important;
            z-index: 20;
        }

        .text-element {
            position: absolute;
            font-weight: 800;
            font-size: clamp(9px, 1vw, 13px);
            color: #000;            
            text-align: center;
            cursor: pointer;
            text-transform: uppercase;
            z-index: 15;
            text-shadow: 
                -1px -1px 0 #fff, 1px -1px 0 #fff, 
                -1px 1px 0 #fff, 1px 1px 0 #fff,
                2px 2px 4px rgba(0,0,0,0.5);
            transform: translate(-50%, -50%); /* Sentralisasi dari titik kordinat */
        }

        .text-input {
            width: 80px;
            padding: 4px;
            border-radius: 4px;
            border: 1px solid #3498db;
            text-transform: uppercase;
            font-size: 12px;
            text-align: center;
            transform: translate(-50%, -50%);
        }

        /* KONTROL UI BAWAH */
        .ui-bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.85);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            border-top: 1px solid #333;
            z-index: 100;
        }

        .timestamp {
            color: #44b3fd;
            font-size: 13px; 
            font-weight: bold;            
        }

        .status-indicator {
            background-color: #34495e;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .highlight-form {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .highlight-form input {
            width: 300px;
            padding: 6px 10px;
            border-radius: 4px;
            border: none;
            background: #fff;
            color: #000;
        }

        .update-button {
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 6px 15px;
            cursor: pointer;
            font-weight: bold;
        }

        .update-button:hover { background-color: #2980b9; }

        /* TEKS HIGHLIGHT DI PAPAN */
        .highlight-display-board {
            position: absolute;
            top: 36%; /* Posisi persentase disesuaikan dengan kotak HIGHLIGHT PROJECT di gambar */
            right: 6%; 
            width: 40%;
            text-align: center;
            color: #f1c40f;
            font-weight: bold;
            font-size: clamp(12px, 1.5vw, 20px);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 5;
            pointer-events: none;
        }

        /* TOMBOL MENU PESAWAT */
        .control-panel {
            display: flex;
            gap: 10px;
            position: relative;
        }

        .button-container {
            display: none;
            position: absolute;
            bottom: 50px;
            right: 0;
            background-color: rgba(30, 30, 30, 0.95);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #444;
            width: 250px;
            gap: 8px;
            flex-wrap: wrap;
            box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.5);
        }
        .button-container.visible { display: flex; }

        .main-button {
            background-color: #e67e22;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 8px 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        .main-button:hover { background-color: #d35400; }

        .image-button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            flex: 1 1 30%;
        }
        .image-button:hover { background-color: #2980b9; }

        .eraser-button { background-color: #e74c3c; flex: 1 1 100%; }
        .eraser-button.active { background-color: #c0392b; box-shadow: inset 0 0 5px #000; border: 1px solid #fff; }
    </style>
</head>
<body>
    <div class="header">
        <h2>Aircraft Parking Management</h2>
    </div>

    <!-- AREA PARKIR UTAMA -->
    <div class="parking-board" id="parkingBoard">
        <div class="images-container" id="imagesContainer"></div>
        <!-- Teks Highlight Muncul di Sini -->
        <div class="highlight-display-board" id="highlightDisplay"></div>
    </div>

    <!-- UI KONTROL BAWAH -->
    <div class="ui-bottom-bar">
        <div class="timestamp" id="timestamp">Last Updated: Not yet modified</div>
        
        <div class="status-indicator" id="statusIndicator">Mode: Normal / Edit</div>

        <div class="highlight-form">
            <input type="text" id="highlightInput" placeholder="Update Highlight Text...">
            <button class="update-button" id="updateHighlightButton">Update</button>
        </div>

        <div class="control-panel">
            <button class="main-button" id="toggleButtons">➕ Add Aircraft</button>        
            <div class="button-container" id="buttonContainer">
                <button class="image-button" onclick="addImage('GA.png')" title="General Aviation">GA</button>
                <button class="image-button" onclick="addImage('QG.png')" title="Quick Ground">QG</button>
                <button class="image-button" onclick="addImage('NGA.png')" title="Non-GA Aircraft">NGA</button>
                <button class="image-button" onclick="addImage('MILITARY.png')" title="Military">MIL</button>
                <button class="image-button" onclick="addImage('jacking.png')" title="A/C On Jack">Jack</button>
                <button class="image-button" onclick="addImage('taildock.png')" title="Tail Dock">Tail</button>
                <button class="image-button" onclick="addImage('fuselagedock.png')" title="Fuse Dock">Fuse</button>
                <button class="image-button" onclick="addImage('bothdock.png')" title="Both Dock">Both</button>
                <button class="image-button eraser-button" id="eraserButton" onclick="toggleEraser()">🗑️ Erase Mode</button>
            </div>
        </div>
    </div>

    <script>
        // INISIALISASI SUPABASE CLOUD
        const SUPABASE_URL = "https://vmhxqjaphzpmyeszvlao.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_aXbq9WihrfTM968QFScX7w_V1m-LGZb";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const addedImages = [];
        const container = document.getElementById('imagesContainer');
        const parkingBoard = document.getElementById('parkingBoard');
        
        let eraserMode = false;

        function updateTimestamp() {
            const now = new Date();
            const date = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const mins = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('timestamp').textContent = `Last Update: ${date}/${month}/${now.getFullYear()} - ${hours}:${mins}`;
        }

        async function saveToSupabase() {
            try {
                const state = addedImages.map(img => ({
                    src: img.src.substring(img.src.lastIndexOf('/') + 1), 
                    left: img.style.left, // Tersimpan dalam %
                    top: img.style.top,   // Tersimpan dalam %
                    text: img.textElement ? img.textElement.textContent : '', 
                    transform: img.style.transform 
                }));

                await supabaseClient.from('parking_state').upsert({ id: 1, layout_data: state });
            } catch (err) {
                console.error("Gagal menyimpan:", err.message);
            }
        }

        async function loadFromSupabase() {
            try {
                const { data } = await supabaseClient.from('parking_state').select('layout_data').eq('id', 1).maybeSingle();
                if (data && data.layout_data) {
                    container.innerHTML = "";
                    addedImages.length = 0;
                    data.layout_data.forEach(item => {
                        const img = document.createElement('img');
                        img.src = item.src;
                        img.className = 'draggable-image';
                        img.style.left = item.left;
                        img.style.top = item.top;
                        img.style.transform = item.transform; 
                        makeDraggable(img);
                        container.appendChild(img);
                        addedImages.push(img);
                        if (item.text) addTextOverImage(item.text, img);
                    });
                }
            } catch (err) {}
        }

        document.getElementById('toggleButtons').addEventListener('click', function() {
            document.getElementById('buttonContainer').classList.toggle('visible');
        });

        function addImage(src) {
            const img = document.createElement('img');
            img.src = src;
            img.className = 'draggable-image';

            // Taruh di tengah map saat pertama kali dipanggil (50%)
            img.style.left = `50%`;
            img.style.top = `50%`;
            img.style.transform = 'translate(-50%, -50%)'; // Centering helper
            
            makeDraggable(img);
            container.appendChild(img);
            addedImages.push(img);

            if (!['jacking.png', 'taildock.png', 'fuselagedock.png', 'bothdock.png'].includes(src)) {
                const textInput = document.createElement('input');
                textInput.type = 'text';
                textInput.placeholder = 'A/C REG';
                textInput.className = 'text-input';
                textInput.style.position = 'absolute';
                textInput.style.left = `50%`;
                textInput.style.top = `55%`; 

                img.textInput = textInput; 

                textInput.addEventListener('keypress', async function(event) {
                    if (event.key === 'Enter') {
                        addTextOverImage(textInput.value, img);
                        container.removeChild(textInput); 
                        await saveToSupabase(); 
                        updateTimestamp(); 
                    }
                });
                container.appendChild(textInput);
                textInput.focus();
            }

            document.getElementById('buttonContainer').classList.remove('visible');
            updateTimestamp(); 
            saveToSupabase(); 
        }

        function addTextOverImage(text, img) {
            const textElement = document.createElement('div');
            textElement.textContent = text;
            textElement.className = 'text-element';
            
            // Teks menempel persis di koordinat gambar
            textElement.style.left = img.style.left;
            textElement.style.top = img.style.top; 

            textElement.addEventListener('click', function() {
                const input = document.createElement('input');
                input.type = 'text';
                input.value = textElement.textContent;
                input.className = 'text-input';
                input.style.position = 'absolute';
                input.style.left = textElement.style.left;
                input.style.top = textElement.style.top;

                input.addEventListener('keypress', async function(event) {
                    if (event.key === 'Enter') {
                        textElement.textContent = input.value; 
                        container.appendChild(textElement); 
                        container.removeChild(input); 
                        await saveToSupabase();
                        updateTimestamp();
                    }
                });
                container.appendChild(input);
                input.focus(); 
                container.removeChild(textElement);
            });
            container.appendChild(textElement);
            img.textElement = textElement; 
        }

        function toggleEraser() {
            eraserMode = !eraserMode;
            const btn = document.getElementById('eraserButton');
            const status = document.getElementById('statusIndicator');
            
            btn.classList.toggle('active', eraserMode);
            if (eraserMode) {
                status.textContent = "Mode: Hapus (Klik Pesawat)";
                status.style.backgroundColor = "#c0392b";
                parkingBoard.style.cursor = `url("data:image/svg+xml;utf8,<svg xmlns='http://w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%23e74c3c' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z'></path><line x1='18' y1='9' x2='12' y2='15'></line><line x1='12' y1='9' x2='18' y2='15'></line></svg>") 12 12, not-allowed`;
            } else {
                status.textContent = "Mode: Normal / Edit";
                status.style.backgroundColor = "#34495e";
                parkingBoard.style.cursor = "";
            }
        }

        function makeDraggable(element) {
            element.onmousedown = function(e) {
                if (eraserMode) {
                    if (confirm("Hapus pesawat ini?")) {
                        if (element.textElement) container.removeChild(element.textElement);
                        if (element.textInput) container.removeChild(element.textInput);
                        container.removeChild(element);
                        const index = addedImages.indexOf(element);
                        if (index > -1) addedImages.splice(index, 1);
                        updateTimestamp(); 
                        saveToSupabase(); 
                    }
                    return;
                }

                e.preventDefault();
                element.style.zIndex = '100';
                if(element.textElement) element.textElement.style.zIndex = '101';
                
                const boardRect = parkingBoard.getBoundingClientRect();
                
                function moveImage(e) {
                    e.preventDefault();
                    
                    // Kalkulasi posisi mouse relatif terhadap ukuran layout saat ini
                    let x = e.clientX - boardRect.left;
                    let y = e.clientY - boardRect.top;

                    // Batasan agar tidak keluar dari map
                    x = Math.max(0, Math.min(x, boardRect.width));
                    y = Math.max(0, Math.min(y, boardRect.height));

                    // MENGUBAH KOORDINAT MENJADI PERSENTASE (%)
                    const xPercent = (x / boardRect.width) * 100;
                    const yPercent = (y / boardRect.height) * 100;

                    element.style.left = `${xPercent}%`;
                    element.style.top = `${yPercent}%`;

                    if (element.textElement) {
                        element.textElement.style.left = `${xPercent}%`;
                        element.textElement.style.top = `${yPercent}%`;
                    }
                }

                async function stopDragging() {
                    document.onmouseup = null;
                    document.onmousemove = null;
                    element.style.zIndex = '10';
                    if(element.textElement) element.textElement.style.zIndex = '15';
                    await saveToSupabase(); 
                    updateTimestamp(); 
                }

                document.onmousemove = moveImage;
                document.onmouseup = stopDragging;
            };

            element.ondblclick = async function() {
                // Hapus translate sebelumnya agar rotasi mulus, gabungkan transform
                let currentRotation = element.rotation || 0; 
                currentRotation += 90; 
                element.style.transform = `translate(-50%, -50%) rotate(${currentRotation}deg)`; 
                element.rotation = currentRotation; 
                await saveToSupabase();
            };
        }

        // HIGHLIGHT SYSTEM
        const highlightDisplay = document.getElementById('highlightDisplay');
        const highlightInput = document.getElementById('highlightInput');

        async function loadHighlightFromSupabase() {
            try {
                const { data } = await supabaseClient.from('parking_highlight').select('highlight_text').eq('id', 1).maybeSingle();
                if (data && data.highlight_text) {
                    highlightDisplay.innerHTML = data.highlight_text.replace(/\n/g, '<br>');
                }
            } catch (err) {}
        }

        async function saveHighlightToSupabase(text) {
            try {
                await supabaseClient.from('parking_highlight').upsert({ id: 1, highlight_text: text });
            } catch (err) {}
        }

        document.getElementById('updateHighlightButton').addEventListener('click', async function() {
            const text = highlightInput.value;
            highlightDisplay.innerHTML = text.replace(/\n/g, '<br>'); 
            highlightInput.value = ''; 
            await saveHighlightToSupabase(text); 
            updateTimestamp(); 
        });

        highlightInput.addEventListener('keypress', async function(event) {
            if (event.key === 'Enter') {
                const text = highlightInput.value;
                highlightDisplay.innerHTML = text.replace(/\n/g, '<br>'); 
                highlightInput.value = ''; 
                await saveHighlightToSupabase(text); 
                updateTimestamp();
            }
        });

        window.onload = async function() {
            await loadFromSupabase();
            await loadHighlightFromSupabase(); 
            updateTimestamp(); 
        };
    </script>
</body>
</html>
