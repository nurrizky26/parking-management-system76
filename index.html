<!DOCTYPE html>
<html lang="en">
<head>
    <!-- PANGGIL LIBRARY SUPABASE RESMI VIA CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parking Management System</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.7);            
        }

        .header {
            text-align: center;
            background-color: rgba(0, 0, 0, 0.6);
            width: 100%;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            position: absolute;
            top: 0;
            z-index: 50;
        }

        .title-container {
            flex: 1;
        }

        .timeupdate {
            position: fixed; 
            border-radius: 10%;            
            bottom: 200px;
            right: 70px;            
            display: flex;
            flex-direction: column;            
        }

        .timestamp {
            display: flex;     
            text-shadow: none;      
            color: rgb(0, 0, 0);
            font-size: 13px; 
            font-weight: bold;            
        }

        .control-panel {
            position: fixed;
            bottom: 10px;
            right: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 100;
        }        

        .main-button {
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }        

        .main-button:hover {
            background-color: #2980b9;
            transform: scale(1.1);
        }

        .button-container {
            position: absolute;
            bottom: 50px;
            right: 0;
            display: none;
            flex-wrap: wrap;
            gap: 6px;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 8px;
            width: 180px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        .button-container.visible {
            display: flex;
        }

        .image-button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 6px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            width: 50px;
            transition: all 0.2s ease;
        }

        .image-button:hover { background-color: #2980b9; }
        .eraser-button { background-color: #e74c3c; }
        .eraser-button.active { background-color: #c0392b; box-shadow: 0 0 0 2px white; }

        .images-container {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            overflow: hidden;
            z-index: 5;
        }

        .draggable-image {
            position: absolute;
            cursor: move;
            width: 10%;
            height: auto;
            max-width: 48px;
            max-height: 48px;
            z-index: 10;
            transition: transform 0.1s;
            filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.3));
            transform: translate(-50%, -50%);
        }

        .draggable-image:hover {
            transform: translate(-50%, -50%) scale(1.15);
            z-index: 20;
        }

        .status-indicator {
            position: fixed;
            bottom: 10px;
            right: 150px;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 12px;
            z-index: 50;
        }

        .text-element {
            position: absolute;
            font-weight: bold;
            font-size: 12px;
            color: black;            
            text-align: center;
            cursor: pointer;
            text-transform: uppercase;
            z-index: 15;
            text-shadow: 1px 1px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 4px 4px 8px rgba(255,255,255,0.3);
            transform: translate(-50%, -50%);
        }

        .text-input {
            width: 100px;
            padding: 4px;
            border-radius: 4px;
            border: none;
            margin-top: 3px;
            text-transform: uppercase;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body style="background-image: url('backgroundparking.png'); background-size: 100% 100%; background-position: center; background-repeat: no-repeat;">
    
    <div class="header">
        <div class="title-container">
            <h2 style="margin: 0; font-size: 18px;">Aircraft Parking System</h2>            
        </div>        
    </div>

    <div class="images-container" id="imagesContainer"></div>

    <div class="timeupdate">
        <div class="timestamp" id="timestamp"> Last Updated: Not yet modified </div>
    </div>    

    <div class="control-panel">
        <button class="main-button" id="toggleButtons">+</button>        
        <div class="button-container" id="buttonContainer">
            <button class="image-button" onclick="addImage('GA.png')" title="General Aviation">GA</button>
            <button class="image-button" onclick="addImage('QG.png')" title="Quick Ground">QG</button>
            <button class="image-button" onclick="addImage('NGA.png')" title="Non-GA Aircraft">NGA</button>
            <button class="image-button" onclick="addImage('MILITARY.png')" title="Military">MIL</button>
            <button class="image-button" onclick="addImage('jacking.png')" title="General Aviation">Jack</button>
            <button class="image-button" onclick="addImage('taildock.png')" title="General Aviation">Tail</button>
            <button class="image-button" onclick="addImage('fuselagedock.png')" title="General Aviation">Fuse</button>
            <button class="image-button" onclick="addImage('bothdock.png')" title="General Aviation">Both</button>
            <button class="image-button eraser-button" id="eraserButton" onclick="toggleEraser()" title="Click to erase images">Erase</button>
        </div>
    </div>    
    
    <div class="status-indicator" id="statusIndicator"> Add Or Edit Mode </div>    

    <script>
        const SUPABASE_URL = "https://vmhxqjaphzpmyeszvlao.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_aXbq9WihrfTM968QFScX7w_V1m-LGZb";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const addedImages = [];
        const container = document.getElementById('imagesContainer');
        const toggleButton = document.getElementById('toggleButtons');
        const buttonContainer = document.getElementById('buttonContainer');
        const eraserButton = document.getElementById('eraserButton');
        const statusIndicator = document.getElementById('statusIndicator');
        const timestampElement = document.getElementById('timestamp');
        
        let eraserMode = false;
        
        function updateTimestamp() {
            const now = new Date();
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const dayName = days[now.getDay()];
            const date = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const year = now.getFullYear();
            timestampElement.textContent = `${dayName}, ${date}/${month}/${year}, ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        }

        async function saveToSupabase() {
            try {
                const state = addedImages.map(img => ({
                    src: img.src.substring(img.src.lastIndexOf('/') + 1), 
                    left: img.style.left,
                    top: img.style.top,
                    text: img.textElement ? img.textElement.textContent : '', 
                    transform: img.style.transform 
                }));

                await supabaseClient.from('parking_state').upsert({ id: 1, layout_data: state });
            } catch (err) {
                console.error("Gagal menyimpan:", err.message);
            }
        }

        async function loadFromSupabase() {
            try {
                const { data } = await supabaseClient.from('parking_state').select('layout_data').eq('id', 1).maybeSingle();

                if (data && data.layout_data) {
                    container.innerHTML = "";
                    addedImages.length = 0;

                    data.layout_data.forEach(item => {
                        const img = document.createElement('img');
                        img.src = item.src;
                        img.className = 'draggable-image';
                        img.style.left = item.left;
                        img.style.top = item.top;
                        img.style.transform = item.transform; 
                        makeDraggable(img);
                        container.appendChild(img);
                        addedImages.push(img);
                        if (item.text) {
                            addTextOverImage(item.text, img);
                        }
                    });
                }
            } catch (err) {}
        }

        toggleButton.addEventListener('click', function() {
            buttonContainer.classList.toggle('visible');
            toggleButton.textContent = buttonContainer.classList.contains('visible') ? '×' : '+';
        });

        function addImage(src) {
            const img = document.createElement('img');
            img.src = src;
            img.className = 'draggable-image';

            img.style.left = `50%`;
            img.style.top = `50%`;
            makeDraggable(img);
            container.appendChild(img);
            addedImages.push(img);

            if (!['jacking.png', 'taildock.png', 'fuselagedock.png', 'bothdock.png'].includes(src)) {
                const textInput = document.createElement('input');
                textInput.type = 'text';
                textInput.placeholder = 'REG';
                textInput.className = 'text-input';
                textInput.style.position = 'absolute';
                textInput.style.left = `50%`;
                textInput.style.top = `55%`; 

                img.textInput = textInput; 

                textInput.addEventListener('keypress', async function(event) {
                    if (event.key === 'Enter') {
                        addTextOverImage(textInput.value, img);
                        container.removeChild(textInput); 
                        await saveToSupabase(); 
                        updateTimestamp(); 
                    }
                });
                container.appendChild(textInput);
                textInput.focus();
            }

            buttonContainer.classList.remove('visible');
            toggleButton.textContent = '+';
            updateTimestamp(); 
            saveToSupabase(); 
        }

        function addTextOverImage(text, img) {
            const textElement = document.createElement('div');
            textElement.textContent = text;
            textElement.className = 'text-element';
            textElement.style.left = img.style.left;
            textElement.style.top = img.style.top; 

            textElement.addEventListener('click', function() {
                const input = document.createElement('input');
                input.type = 'text';
                input.value = textElement.textContent;
                input.className = 'text-input';
                input.style.position = 'absolute';
                input.style.left = textElement.style.left;
                input.style.top = textElement.style.top;

                input.addEventListener('keypress', async function(event) {
                    if (event.key === 'Enter') {
                        textElement.textContent = input.value; 
                        container.appendChild(textElement); 
                        container.removeChild(input); 
                        await saveToSupabase();
                        updateTimestamp();
                    }
                });
                container.appendChild(input);
                input.focus(); 
                container.removeChild(textElement);
            });
            container.appendChild(textElement);
            img.textElement = textElement; 
        }

        function toggleEraser() {
            eraserMode = !eraserMode;
            eraserButton.classList.toggle('active', eraserMode);
            if (eraserMode) {
                statusIndicator.textContent = "Erase Mode (Click Image)";
                container.style.cursor = `url("data:image/svg+xml;utf8,<svg xmlns='http://w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%23e74c3c' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z'></path><line x1='18' y1='9' x2='12' y2='15'></line><line x1='12' y1='9' x2='18' y2='15'></line></svg>") 12 12, not-allowed`;
            } else {
                statusIndicator.textContent = "Add Or Edit Mode";
                container.style.cursor = "";
            }
            updateTimestamp();
        }

        function makeDraggable(element) {
            element.onmousedown = function(e) {
                if (eraserMode) {
                    if (confirm("Delete this image?")) {
                        if (element.textElement) container.removeChild(element.textElement);
                        if (element.textInput) container.removeChild(element.textInput);
                        container.removeChild(element);
                        const index = addedImages.indexOf(element);
                        if (index > -1) addedImages.splice(index, 1);
                        updateTimestamp(); 
                        saveToSupabase(); 
                    }
                    return;
                }

                e.preventDefault();
                element.style.zIndex = '100';
                if(element.textElement) element.textElement.style.zIndex = '101';
                
                function moveImage(e) {
                    e.preventDefault();
                    const containerRect = container.getBoundingClientRect();
                    
                    let x = e.clientX - containerRect.left;
                    let y = e.clientY - containerRect.top;

                    x = Math.max(0, Math.min(x, containerRect.width));
                    y = Math.max(0, Math.min(y, containerRect.height));

                    const xPercent = (x / containerRect.width) * 100;
                    const yPercent = (y / containerRect.height) * 100;

                    element.style.left = `${xPercent}%`;
                    element.style.top = `${yPercent}%`;

                    if (element.textElement) {
                        element.textElement.style.left = `${xPercent}%`;
                        element.textElement.style.top = `${yPercent}%`;
                    }
                }

                async function stopDragging() {
                    document.onmouseup = null;
                    document.onmousemove = null;
                    element.style.zIndex = '10';
                    if(element.textElement) element.textElement.style.zIndex = '15';
                    await saveToSupabase(); 
                    updateTimestamp(); 
                }

                document.onmousemove = moveImage;
                document.onmouseup = stopDragging;
            };

            element.ondblclick = async function() {
                let currentRotation = element.rotation || 0; 
                currentRotation += 90; 
                element.style.transform = `translate(-50%, -50%) rotate(${currentRotation}deg)`; 
                element.rotation = currentRotation; 
                await saveToSupabase();
            };
        }

        window.onload = async function() {
            await loadFromSupabase();
            updateTimestamp(); 
        };
    </script>
</body>
</html>
