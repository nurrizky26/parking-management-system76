<!DOCTYPE html>
<html lang="en">
<head>
    <!-- PANGGIL LIBRARY SUPABASE RESMI VIA CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aircraft Parking System</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.7);
            background-image: url('backgroundparking.png');
            background-size: 100% 100%; /* Memaksa background full screen di device manapun */
            background-position: center;
            background-repeat: no-repeat;
        }

        .header {
            text-align: center;
            background-color: rgba(0, 0, 0, 0.6);
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 50;
        }

        .header h2 {
            margin: 0;
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .images-container {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100vw;
            height: 100vh;
            z-index: 5;
        }

        /* --- POSISI UI MELAYANG --- */
        
        /* Posisi tepat di atas area NCC di gambar background */
        .timeupdate {
            position: absolute; 
            top: 45%;
            right: 5%;            
            z-index: 100;
        }

        .timestamp {
            color: white;
            font-size: 14px; 
            font-weight: bold;
            background-color: rgba(0, 0, 0, 0.6);
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid #555;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
        }

        .status-indicator {
            position: absolute;
            bottom: 20px;
            right: 80px; /* Di sebelah tombol tambah */
            background-color: rgba(0, 0, 0, 0.6);
            padding: 10px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            z-index: 100;
        }

        .control-panel {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            z-index: 100;
        }        

        .main-button {
            background-color: #e67e22;
            color: white;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }        

        .main-button:hover {
            background-color: #d35400;
            transform: scale(1.1);
        }

        .button-container {
            display: none;
            position: absolute;
            bottom: 60px;
            right: 0;
            background-color: rgba(30, 30, 30, 0.95);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
            width: 250px;
            gap: 8px;
            flex-wrap: wrap;
            box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.5);
        }

        .button-container.visible {
            display: flex;
        }

        .image-button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            flex: 1 1 30%;
        }

        .image-button:hover { background-color: #2980b9; }
        .eraser-button { background-color: #e74c3c; flex: 1 1 100%; }
        .eraser-button.active { background-color: #c0392b; box-shadow: inset 0 0 5px #000; border: 1px solid #fff; }

        /* --- SETTING PESAWAT --- */
        .draggable-image {
            position: absolute;
            cursor: move;
            width: 3,5%; 
            min-width: 25px;
            height: auto;
            z-index: 10;
            transition: transform 0.1s;
            filter: drop-shadow(2px 4px 4px rgba(0, 0, 0, 0.6));
            /* Menggunakan CSS Variable --rot untuk rotasi yang akurat */
            transform: translate(-50%, -50%) rotate(var(--rot, 0deg)); 
        }

        .draggable-image:hover {
            /* Menjaga rotasi tetap ada saat di-hover dan menambahkan efek scale */
            transform: translate(-50%, -50%) rotate(var(--rot, 0deg)) scale(1.15) !important;
            z-index: 20;
        }

        .text-element {
            position: absolute;
            font-weight: 800;
            font-size: clamp(9px, 1vw, 13px);
            color: #000;            
            text-align: center;
            cursor: pointer;
            text-transform: uppercase;
            z-index: 15;
            text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff, 2px 2px 4px rgba(0,0,0,0.5);
            
            /* Menggeser posisi teks ke arah KANAN ATAS dari titik kordinat pesawat */
            transform: translate(15%, -130%); 
        }

        .text-input {
            width: 80px;
            padding: 4px;
            border-radius: 4px;
            border: 1px solid #3498db;
            text-transform: uppercase;
            font-size: 12px;
            text-align: center;
            
            /* Samakan posisi form input dengan teks statis */
            transform: translate(15%, -130%); 
        }
    </style>
</head>
<body>
    <div class="header">
        <h2>Aircraft Parking Management</h2>
    </div>

    <!-- WADAH FULLSCREEN -->
    <div class="images-container" id="imagesContainer"></div>

    <div class="timeupdate">
        <div class="timestamp" id="timestamp">Last Update: -</div>
    </div>    

    <div class="status-indicator" id="statusIndicator">Mode: Normal / Edit</div>    

    <div class="control-panel">
        <button class="main-button" id="toggleButtons">+</button>        
        <div class="button-container" id="buttonContainer">
            <button class="image-button" onclick="addImage('ga.png')" title="General Aviation">GA</button>
            <button class="image-button" onclick="addImage('qg.png')" title="Quick Ground">QG</button>
            <button class="image-button" onclick="addImage('nga.png')" title="Non-GA Aircraft">NGA</button>
            <button class="image-button" onclick="addImage('military.png')" title="Military">MIL</button>
            <button class="image-button" onclick="addImage('jacking.png')" title="A/C On Jack">Jack</button>
            <button class="image-button" onclick="addImage('taildock.png')" title="Tail Dock">Tail</button>
            <button class="image-button" onclick="addImage('fuselagedock.png')" title="Fuse Dock">Fuse</button>
            <button class="image-button" onclick="addImage('bothdock.png')" title="Both Dock">Both</button>
            <button class="image-button eraser-button" id="eraserButton" onclick="toggleEraser()">🗑️ Erase Mode</button>
        </div>
    </div>    

    <script>
        // INISIALISASI SUPABASE
        const SUPABASE_URL = "https://vmhxqjaphzpmyeszvlao.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_aXbq9WihrfTM968QFScX7w_V1m-LGZb";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const addedImages = [];
        const container = document.getElementById('imagesContainer');
        const timestampElement = document.getElementById('timestamp');
        
        let eraserMode = false;

        function updateTimestamp() {
            const now = new Date();
            const date = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const mins = String(now.getMinutes()).padStart(2, '0');
            timestampElement.textContent = `Last Update: ${date}/${month}/${now.getFullYear()} - ${hours}:${mins}`;
        }

        async function saveToSupabase() {
            try {
                const state = addedImages.map(img => ({
                    src: img.src.substring(img.src.lastIndexOf('/') + 1), 
                    left: img.style.left, // %
                    top: img.style.top,   // %
                    text: img.textElement ? img.textElement.textContent : '', 
                    rotation: img.rotation || 0 // Simpan rotasi sebagai angka (Integer)
                }));
                await supabaseClient.from('parking_state').upsert({ id: 1, layout_data: state });
            } catch (err) {
                console.error("Gagal menyimpan:", err.message);
            }
        }

        async function loadFromSupabase() {
            try {
                const { data } = await supabaseClient.from('parking_state').select('layout_data').eq('id', 1).maybeSingle();
                if (data && data.layout_data) {
                    container.innerHTML = "";
                    addedImages.length = 0;
                    data.layout_data.forEach(item => {
                        const img = document.createElement('img');
                        img.src = item.src;
                        img.className = 'draggable-image';
                        img.style.left = item.left;
                        img.style.top = item.top;
                        
                        // Menangani data lama (jika sebelumnya disave berupa transform text)
                        let loadedRotation = item.rotation || 0;
                        if (!item.rotation && item.transform) {
                            const match = item.transform.match(/rotate\((\d+)deg\)/);
                            if (match) loadedRotation = parseInt(match[1]);
                        }

                        // Set rotasi gambar
                        img.rotation = loadedRotation;
                        img.style.setProperty('--rot', `${loadedRotation}deg`);
                        
                        makeDraggable(img);
                        container.appendChild(img);
                        addedImages.push(img);
                        if (item.text) addTextOverImage(item.text, img);
                    });
                }
            } catch (err) {}
        }

        document.getElementById('toggleButtons').addEventListener('click', function() {
            document.getElementById('buttonContainer').classList.toggle('visible');
            this.textContent = document.getElementById('buttonContainer').classList.contains('visible') ? '×' : '+';
        });

        function addImage(src) {
            const img = document.createElement('img');
            img.src = src;
            img.className = 'draggable-image';

            img.style.left = `50%`;
            img.style.top = `50%`;
            img.rotation = 0;
            img.style.setProperty('--rot', '0deg');
            
            makeDraggable(img);
            container.appendChild(img);
            addedImages.push(img);

            if (!['jacking.png', 'taildock.png', 'fuselagedock.png', 'bothdock.png'].includes(src)) {
                const textInput = document.createElement('input');
                textInput.type = 'text';
                textInput.placeholder = 'REG';
                textInput.className = 'text-input';
                textInput.style.position = 'absolute';
                
                // Koordinat form input sama persis dengan pusat gambar (offsetnya diatur oleh CSS transform)
                textInput.style.left = img.style.left;
                textInput.style.top = img.style.top; 

                img.textInput = textInput; 

                textInput.addEventListener('keypress', async function(event) {
                    if (event.key === 'Enter') {
                        addTextOverImage(textInput.value, img);
                        container.removeChild(textInput); 
                        await saveToSupabase(); 
                        updateTimestamp(); 
                    }
                });
                container.appendChild(textInput);
                textInput.focus();
            }

            document.getElementById('buttonContainer').classList.remove('visible');
            document.getElementById('toggleButtons').textContent = '+';
            updateTimestamp(); 
            saveToSupabase(); 
        }

        function addTextOverImage(text, img) {
            const textElement = document.createElement('div');
            textElement.textContent = text;
            textElement.className = 'text-element';
            
            // Koordinat teks mengikuti pusat gambar (offset posisi Kanan-Atas diatur otomatis oleh CSS)
            textElement.style.left = img.style.left;
            textElement.style.top = img.style.top; 

            textElement.addEventListener('click', function() {
                const input = document.createElement('input');
                input.type = 'text';
                input.value = textElement.textContent;
                input.className = 'text-input';
                input.style.position = 'absolute';
                input.style.left = textElement.style.left;
                input.style.top = textElement.style.top;

                input.addEventListener('keypress', async function(event) {
                    if (event.key === 'Enter') {
                        textElement.textContent = input.value; 
                        container.appendChild(textElement); 
                        container.removeChild(input); 
                        await saveToSupabase();
                        updateTimestamp();
                    }
                });
                container.appendChild(input);
                input.focus(); 
                container.removeChild(textElement);
            });
            container.appendChild(textElement);
            img.textElement = textElement; 
        }

        function toggleEraser() {
            eraserMode = !eraserMode;
            const btn = document.getElementById('eraserButton');
            const status = document.getElementById('statusIndicator');
            
            btn.classList.toggle('active', eraserMode);
            if (eraserMode) {
                status.textContent = "Mode: Hapus (Klik Pesawat)";
                status.style.backgroundColor = "#c0392b";
                document.body.style.cursor = `url("data:image/svg+xml;utf8,<svg xmlns='http://w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%23e74c3c' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z'></path><line x1='18' y1='9' x2='12' y2='15'></line><line x1='12' y1='9' x2='18' y2='15'></line></svg>") 12 12, not-allowed`;
            } else {
                status.textContent = "Mode: Normal / Edit";
                status.style.backgroundColor = "rgba(0, 0, 0, 0.6)";
                document.body.style.cursor = "";
            }
        }

        function makeDraggable(element) {
            element.onmousedown = function(e) {
                if (eraserMode) {
                    if (confirm("Hapus pesawat ini?")) {
                        if (element.textElement) container.removeChild(element.textElement);
                        if (element.textInput) container.removeChild(element.textInput);
                        container.removeChild(element);
                        const index = addedImages.indexOf(element);
                        if (index > -1) addedImages.splice(index, 1);
                        updateTimestamp(); 
                        saveToSupabase(); 
                    }
                    return;
                }

                e.preventDefault();
                element.style.zIndex = '100';
                if(element.textElement) element.textElement.style.zIndex = '101';
                
                function moveImage(e) {
                    e.preventDefault();
                    
                    let x = e.clientX;
                    let y = e.clientY;

                    // Batasan agar tidak keluar dari layar
                    x = Math.max(0, Math.min(x, window.innerWidth));
                    y = Math.max(0, Math.min(y, window.innerHeight));

                    const xPercent = (x / window.innerWidth) * 100;
                    const yPercent = (y / window.innerHeight) * 100;

                    element.style.left = `${xPercent}%`;
                    element.style.top = `${yPercent}%`;

                    if (element.textElement) {
                        element.textElement.style.left = `${xPercent}%`;
                        element.textElement.style.top = `${yPercent}%`;
                    }
                }

                async function stopDragging() {
                    document.onmouseup = null;
                    document.onmousemove = null;
                    element.style.zIndex = '10';
                    if(element.textElement) element.textElement.style.zIndex = '15';
                    await saveToSupabase(); 
                    updateTimestamp(); 
                }

                document.onmousemove = moveImage;
                document.onmouseup = stopDragging;
            };

            // LOGIKA ROTASI YANG SUDAH DIPERBAIKI (CLOCKWISE 90 DEG)
            element.ondblclick = async function() {
                let currentRotation = element.rotation || 0; 
                currentRotation += 90; 
                if (currentRotation >= 360) currentRotation = 0; // Reset ke 0 agar angka rotasi tetap bersih
                
                element.rotation = currentRotation; 
                element.style.setProperty('--rot', `${currentRotation}deg`); // Set rotasi ke CSS Variable
                
                await saveToSupabase();
            };
        }

        window.onload = async function() {
            await loadFromSupabase();
            updateTimestamp(); 
        };
    </script>
</body>
</html>
