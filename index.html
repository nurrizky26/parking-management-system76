<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aircraft Parking System</title>
    
    <!-- PANGGIL LIBRARY SUPABASE RESMI VIA CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* CSS UNTUK TAMPILAN INTERFACE AIRCRAFT PARKING SYSTEM */
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            margin: 0; 
            padding: 20px; 
            background-color: #0f172a; 
            color: #f8fafc; 
        }
        .container { 
            max-width: 900px; 
            margin: 0 auto; 
            background: #1e293b; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); 
        }
        h1 { font-size: 1.8rem; color: #38bdf8; margin: 0 0 5px 0; }
        h2 { font-size: 1.4rem; color: #94a3b8; margin: 0 0 15px 0; border-bottom: 2px solid #334155; padding-bottom: 10px; }
        
        .status-bar { 
            font-size: 0.85rem; 
            color: #cbd5e1; 
            margin-bottom: 25px; 
            background: #334155; 
            padding: 8px 12px; 
            border-radius: 6px; 
        }
        .status-time { font-weight: bold; color: #4ade80; }

        /* PANEL KONTROL FORM INPUT */
        .control-panel { 
            background: #0f172a; 
            padding: 20px; 
            border-radius: 8px; 
            border: 1px solid #334155; 
            margin-bottom: 30px; 
        }
        .panel-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 15px; color: #f1f5f9; }
        
        .form-row { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 15px; 
            margin-bottom: 20px; 
        }
        .form-group { display: flex; flex-direction: column; }
        label { font-size: 0.9rem; font-weight: 600; margin-bottom: 6px; color: #94a3b8; }
        
        select { 
            padding: 10px; 
            background: #1e293b; 
            color: #f8fafc; 
            border: 1px solid #475569; 
            border-radius: 6px; 
            font-size: 0.95rem; 
            outline: none; 
            cursor: pointer; 
        }
        select:focus { border-color: #38bdf8; }
        
        .btn-update { 
            background: #0284c7; 
            color: white; 
            border: none; 
            padding: 12px 25px; 
            font-weight: bold; 
            font-size: 0.95rem; 
            border-radius: 6px; 
            cursor: pointer; 
            transition: background 0.2s; 
        }
        .btn-update:hover { background: #0369a1; }

        /* GRID INDIKATOR PARKIR PESAWAT */
        .parking-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); 
            gap: 20px; 
            margin-top: 15px; 
        }
        .parking-slot { 
            background: #0f172a; 
            border: 2px dashed #475569; 
            border-radius: 8px; 
            padding: 20px 10px; 
            text-align: center; 
            min-height: 110px; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            transition: all 0.3s ease; 
        }
        .parking-slot.occupied { 
            background: #1e3a8a; 
            border: 2px solid #3b82f6; 
            box-shadow: 0 0 10px rgba(59,130,246,0.3); 
        }
        
        .slot-name { font-weight: bold; font-size: 1.1rem; color: #f1f5f9; }
        .badge { 
            display: inline-block; 
            padding: 3px 8px; 
            font-size: 0.75rem; 
            font-weight: bold; 
            border-radius: 4px; 
            margin-top: 6px; 
        }
        .badge-airline { background: #ef4444; color: white; }
        .badge-type { background: #eab308; color: #0f172a; }
        .status-text { font-size: 0.8rem; margin-top: 8px; color: #64748b; }
        .status-text.live { color: #60a5fa; }
    </style>
</head>
<body>

<div class="container">
    <h1>Parking Management System</h1>
    <h2>Aircraft Parking System</h2>
    
    <div class="status-bar">
        Status Sinkronisasi Cloud: <span id="lastUpdated" class="status-time">Memuat data cloud...</span>
    </div>

    <!-- PANEL INPUT PENGATURAN MODE PARKIR -->
    <div class="control-panel">
        <div class="panel-title">Add Or Edit Mode</div>
        <form id="parkingForm">
            <div class="form-row">
                <!-- Pilihan Slot -->
                <div class="form-group">
                    <label for="slotSelect">Pilih Nomor Slot (Bay):</label>
                    <select id="slotSelect" required>
                        <option value="1">Slot 01</option>
                        <option value="2">Slot 02</option>
                        <option value="3">Slot 03</option>
                        <option value="4">Slot 04</option>
                        <option value="5">Slot 05</option>
                        <option value="6">Slot 06</option>
                    </select>
                </div>

                <!-- Pilihan Maskapai (Airline) & Opsi Erase -->
                <div class="form-group">
                    <label for="airlineSelect">Maskapai / Opsi:</label>
                    <select id="airlineSelect" required>
                        <option value="GA">GA</option>
                        <option value="QG">QG</option>
                        <option value="NGA">NGA</option>
                        <option value="MIL">MIL</option>
                        <option value="Erase">Erase (Kosongkan Slot)</option>
                    </select>
                </div>

                <!-- Pilihan Bagian Parkir (Parking Type) -->
                <div class="form-group" id="parkingTypeGroup">
                    <label for="typeSelect">Jenis Parkir (Parking Type):</label>
                    <select id="typeSelect">
                        <option value="Jack">Jack</option>
                        <option value="Tail">Tail</option>
                        <option value="Fuse">Fuse</option>
                        <option value="Both">Both</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn-update">Update</button>
        </form>
    </div>

    <!-- AREA LIVE MONITORING DASHBOARD -->
    <div class="panel-title" style="margin-bottom: 10px;">Live Display Overview</div>
    <div class="parking-grid" id="parkingGrid">
        <!-- Struktur elemen grid dimuat otomatis dari Supabase -->
    </div>
</div>

<script>
    // =========================================================================
    // KONEKSI UTAMA KE SUPABASE
    // Silakan ganti kredensial di bawah dengan URL & Anon Key dari project Supabase Anda
    // =========================================================================
    const SUPABASE_URL = "https://vmhxqjaphzpmyeszvlao.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_aXbq9WihrfTM968QFScX7w_V1m-LGZb";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById('parkingForm');
    const airlineSelect = document.getElementById('airlineSelect');
    const parkingTypeGroup = document.getElementById('parkingTypeGroup');
    const parkingGrid = document.getElementById('parkingGrid');
    const lastUpdatedSpan = document.getElementById('lastUpdated');

    // Sembunyikan dropdown tipe komponen parkir jika user memilih aksi 'Erase'
    airlineSelect.addEventListener('change', function() {
        if (this.value === 'Erase') {
            parkingTypeGroup.style.display = 'none';
        } else {
            parkingTypeGroup.style.display = 'flex';
        }
    });

    // =========================================================================
    // FUNGSI 1: MEMBACA DATA DARI DATABASE CLOUD (READ/SELECT)
    // =========================================================================
    async function fetchAndRenderParking() {
        try {
            // Ambil seluruh baris data dari tabel 'aircraft_parking'
            let { data: slotsData, error } = await supabase
                .from('aircraft_parking')
                .select('*')
                .order('slot_number', { ascending: true });

            if (error) throw error;

            // Kosongkan visualisasi kotak parkir lama
            parkingGrid.innerHTML = "";

            // Menghasilkan visualisasi untuk 6 slot parkir
            for (let i = 1; i <= 6; i++) {
                // Cari data di database yang nomor slotnya cocok dengan urutan perulangan
                const dbSlot = slotsData ? slotsData.find(s => parseInt(s.slot_number) === i) : null;
                
                const slotDiv = document.createElement('div');
                slotDiv.className = 'parking-slot';
                
                if (dbSlot && dbSlot.status === 'occupied') {
                    // Jika database mencatat slot sedang terisi
                    slotDiv.classList.add('occupied');
                    slotDiv.innerHTML = `
                        <div class="slot-name">Slot 0${i}</div>
                        <span class="badge badge-airline">${dbSlot.airline}</span>
                        <span class="badge badge-type">${dbSlot.parking_type}</span>
                        <div class="status-text live">Occupied</div>
                    `;
                } else {
                    // Jika database kosong / tidak mencatat data slot ini
                    slotDiv.innerHTML = `
                        <div class="slot-name" style="color: #475569;">Slot 0${i}</div>
                        <div class="status-text" style="margin-top: 15px;">Empty</div>
                    `;
                }
                parkingGrid.appendChild(slotDiv);
            }

            // Tampilkan informasi waktu pengambilan data cloud sukses
            const waktuSekarang = new Date();
            lastUpdatedSpan.innerText = "Terhubung - " + waktuSekarang.toLocaleTimeString('id-ID');

        } catch (error) {
            console.error("Gagal menyinkronkan status data:", error.message);
            lastUpdatedSpan.innerText = "Error sinkronisasi database.";
            lastUpdatedSpan.style.color = "#ef4444";
        }
    }

    // =========================================================================
    // FUNGSI 2: MENYIMPAN / MENGAPUS KE DATABASE CLOUD (INSERT / UPDATE / DELETE)
    // =========================================================================
    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const targetSlot = document.getElementById('slotSelect').value;
        const targetAirline = airlineSelect.value;
        const targetType = document.getElementById('typeSelect').value;

        try {
            // Cek terlebih dahulu apakah nomor slot yang dituju sudah tersimpan di database
            const { data: existingRow } = await supabase
                .from('aircraft_parking')
                .select('id')
                .eq('slot_number', targetSlot)
                .maybeSingle();

            if (targetAirline === 'Erase') {
                // OPERASI HAPUS (DELETE): Jika user memilih opsi Erase
                if (existingRow) {
                    const { error } = await supabase
                        .from('aircraft_parking')
                        .delete()
                        .eq('slot_number', targetSlot);
                    if (error) throw error;
                }
                alert(`Data Slot 0${targetSlot} berhasil dibersihkan dari cloud.`);
            } else {
                // OPERASI SIMPAN DATA MASKAPAI:
                if (existingRow) {
                    // JIKA DATA SUDAH ADA -> Lakukan Update
                    const { error } = await supabase
                        .from('aircraft_parking')
                        .update({
                            airline: targetAirline,
                            parking_type: targetType,
                            status: 'occupied'
                        })
                        .eq('slot_number', targetSlot);
                    if (error) throw error;
                } else {
                    // JIKA DATA BELUM ADA -> Lakukan Insert Baru
                    const { error } = await supabase
                        .from('aircraft_parking')
                        .insert([
                            {
                                slot_number: targetSlot,
                                airline: targetAirline,
                                parking_type: targetType,
                                status: 'occupied'
                            }
                        ]);
                    if (error) throw error;
                }
                alert(`Data Slot 0${targetSlot} berhasil disimpan ke cloud.`);
            }

            // Kembalikan form ke keadaan awal dan muat ulang grafis dashboard
            form.reset();
            parkingTypeGroup.style.display = 'flex';
            fetchAndRenderParking();

        } catch (error) {
            alert("Operasi penyimpanan gagal: " + error.message);
            console.error("Detail teknis error:", error);
        }
    });

    // Pemicu otomatis untuk menarik data cloud pertama kali saat halaman web dimuat browser
    document.addEventListener("DOMContentLoaded", fetchAndRenderParking);
</script>

</body>
</html>
