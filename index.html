<!DOCTYPE html>
<html lang="en">
<head>
    <!-- PANGGIL LIBRARY SUPABASE RESMI VIA CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aircraft Parking System</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.7);
            background-image: url('backgroundparking.png');
            background-size: 100% 100%; 
            background-position: center;
            background-repeat: no-repeat;
        }

        .header {
            text-align: center;
            background-color: rgba(0, 0, 0, 0.6);
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 50;
        }

        .header h2 {
            margin: 0;
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .images-container {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100vw;
            height: 100vh;
            z-index: 5;
        }

        .timeupdate {
            position: absolute; 
            top: 45%;
            right: 5%;            
            z-index: 100;
        }

        .timestamp {
            color: white;
            font-size: 14px; 
            font-weight: bold;
            background-color: rgba(0, 0, 0, 0.6);
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid #555;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
        }

        .status-indicator {
            position: absolute;
            bottom: 20px;
            right: 90px;
            background-color: #7f8c8d; /* Warna default terkunci */
            padding: 10px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            z-index: 100;
            transition: background-color 0.3s;
        }

        .control-panel {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
            z-index: 100;
        }        

        .main-button {
            background-color: #e67e22;
            color: white;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }        

        .main-button:hover {
            transform: scale(1.1);
        }

        #lockUnlockBtn {
            background-color: #c0392b; /* Merah untuk Terkunci */
            font-size: 20px;
        }

        #toggleButtons {
            display: none; /* Disembunyikan saat terkunci */
        }

        .button-container {
            display: none;
            position: absolute;
            bottom: 110px; /* Disesuaikan karena ada dua tombol bulat sekarang */
            right: 0;
            background-color: rgba(30, 30, 30, 0.95);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
            width: 250px;
            gap: 8px;
            flex-wrap: wrap;
            box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.5);
        }

        .button-container.visible {
            display: flex;
        }

        .image-button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            flex: 1 1 30%;
        }

        .image-button:hover { background-color: #2980b9; }
        .eraser-button { background-color: #e74c3c; flex: 1 1 100%; }
        .eraser-button.active { background-color: #c0392b; box-shadow: inset 0 0 5px #000; border: 1px solid #fff; }

        .draggable-image {
            position: absolute;
            width: 3.5%; 
            min-width: 25px;
            height: auto;
            z-index: 10;
            transition: transform 0.1s;
            filter: drop-shadow(2px 4px 4px rgba(0, 0, 0, 0.6));
            transform: translate(-50%, -50%) rotate(var(--rot, 0deg)); 
            /* Kursor default diset biasa, berubah jadi move hanya kalau unlock */
            cursor: default; 
        }

        .draggable-image.editable {
            cursor: move;
        }

        .draggable-image.editable:hover {
            transform: translate(-50%, -50%) rotate(var(--rot, 0deg)) scale(1.15) !important;
            z-index: 20;
        }

        .text-element {
            position: absolute;
            font-weight: 800;
            font-size: clamp(9px, 1vw, 13px);
            color: #000;            
            text-align: center;
            text-transform: uppercase;
            z-index: 15;
            text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff, 2px 2px 4px rgba(0,0,0,0.5);
            transform: translate(15%, -130%); 
            cursor: default;
        }
        
        .text-element.editable {
            cursor: pointer;
        }

        .text-input {
            width: 80px;
            padding: 4px;
            border-radius: 4px;
            border: 1px solid #3498db;
            text-transform: uppercase;
            font-size: 12px;
            text-align: center;
            transform: translate(15%, -130%); 
        }

        /* --- CATATAN KECIL DI BAWAH --- */
        .footer-note {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            font-weight: bold;
            color: #cc0000; 
            text-shadow: 1px 1px 3px rgba(255, 255, 255, 0.9), -1px -1px 3px rgba(255, 255, 255, 0.9);
            z-index: 100;
            pointer-events: none;
            text-align: center;
            width: 100%;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h2>Aircraft Parking Management</h2>
    </div>

    <div class="images-container" id="imagesContainer"></div>

    <div class="timeupdate">
        <div class="timestamp" id="timestamp">Last Update: -</div>
    </div>    

    <div class="status-indicator" id="statusIndicator">Mode: Terkunci (Hanya Lihat)</div>    

    <div class="control-panel">
        <button class="main-button" id="toggleButtons" title="Tambah Pesawat">+</button>        
        <button class="main-button" id="lockUnlockBtn" title="Buka Kunci Edit">🔒</button>        

        <div class="button-container" id="buttonContainer">
            <button class="image-button" onclick="addImage('ga.png')">GA</button>
            <button class="image-button" onclick="addImage('qg.png')">QG</button>
            <button class="image-button" onclick="addImage('nga.png')">NGA</button>
            <button class="image-button" onclick="addImage('military.png')">MIL</button>
            <button class="image-button" onclick="addImage('jacking.png')">Jack</button>
            <button class="image-button" onclick="addImage('taildock.png')">Tail</button>
            <button class="image-button" onclick="addImage('fuselagedock.png')">Fuse</button>
            <button class="image-button" onclick="addImage('bothdock.png')">Both</button>
            <button class="image-button eraser-button" id="eraserButton" onclick="toggleEraser()">🗑️ Erase Mode</button>
        </div>
    </div>    

    <div class="footer-note">
        *SETELAH UPDATE PARKING LAKUKAN RELOAD PAGE, UNTUK MEMASTIKAN PARKING SUDAH SESUAI, KEMUDIAN KUNCI KEMBALI PAGE
    </div>

    <script>
        // INISIALISASI SUPABASE
        const SUPABASE_URL = "https://vmhxqjaphzpmyeszvlao.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_aXbq9WihrfTM968QFScX7w_V1m-LGZb";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const addedImages = [];
        const container = document.getElementById('imagesContainer');
        const timestampElement = document.getElementById('timestamp');
        const lockUnlockBtn = document.getElementById('lockUnlockBtn');
        const toggleButtons = document.getElementById('toggleButtons');
        const statusIndicator = document.getElementById('statusIndicator');
        const buttonContainer = document.getElementById('buttonContainer');
        
        let eraserMode = false;
        
        // SISTEM PASSWORD & LOCK
        const EDIT_PASSWORD = "papagolda76";
        let isEditAllowed = false; // Default: Terkunci

        // Logika Kunci/Buka
        lockUnlockBtn.addEventListener('click', function() {
            if (isEditAllowed) {
                // Proses Mengunci
                isEditAllowed = false;
                lockUnlockBtn.innerHTML = "🔒";
                lockUnlockBtn.style.backgroundColor = "#c0392b"; // Merah
                toggleButtons.style.display = "none";
                statusIndicator.textContent = "Mode: Terkunci (Hanya Lihat)";
                statusIndicator.style.backgroundColor = "#7f8c8d";
                buttonContainer.classList.remove('visible');
                if (eraserMode) toggleEraser(); // Matikan mode hapus jika sedang aktif
                updateEditableClasses(); // Hapus efek hover/cursor
            } else {
                // Proses Membuka Kunci
                const pwd = prompt("Masukkan password untuk mengedit parking:");
                if (pwd === EDIT_PASSWORD) {
                    isEditAllowed = true;
                    lockUnlockBtn.innerHTML = "🔓";
                    lockUnlockBtn.style.backgroundColor = "#27ae60"; // Hijau
                    toggleButtons.style.display = "flex";
                    statusIndicator.textContent = "Mode: Normal / Edit";
                    statusIndicator.style.backgroundColor = "rgba(0, 0, 0, 0.6)";
                    updateEditableClasses(); // Berikan efek hover/cursor move
                } else if (pwd !== null) {
                    alert("Password Salah! Akses ditolak.");
                }
            }
        });

        // Mengatur class agar UI merespon bisa diklik atau tidak
        function updateEditableClasses() {
            const images = document.querySelectorAll('.draggable-image');
            const texts = document.querySelectorAll('.text-element');
            if (isEditAllowed) {
                images.forEach(el => el.classList.add('editable'));
                texts.forEach(el => el.classList.add('editable'));
            } else {
                images.forEach(el => el.classList.remove('editable'));
                texts.forEach(el => el.classList.remove('editable'));
            }
        }

        function updateTimestamp() {
            const now = new Date();
            const date = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const mins = String(now.getMinutes()).padStart(2, '0');
            timestampElement.textContent = `Last Update: ${date}/${month}/${now.getFullYear()} - ${hours}:${mins}`;
        }

        async function saveToSupabase() {
            try {
                const state = addedImages.map(img => ({
                    src: img.src.substring(img.src.lastIndexOf('/') + 1), 
                    left: img.style.left, 
                    top: img.style.top,   
                    text: img.textElement ? img.textElement.textContent : '', 
                    rotation: img.rotation || 0 
                }));
                await supabaseClient.from('parking_state').upsert({ id: 1, layout_data: state });
            } catch (err) {
                console.error("Gagal menyimpan:", err.message);
            }
        }

        async function loadFromSupabase() {
            try {
                const { data } = await supabaseClient.from('parking_state').select('layout_data').eq('id', 1).maybeSingle();
                if (data && data.layout_data) {
                    container.innerHTML = "";
                    addedImages.length = 0;
                    data.layout_data.forEach(item => {
                        const img = document.createElement('img');
                        img.src = item.src;
                        img.className = 'draggable-image';
                        img.style.left = item.left;
                        img.style.top = item.top;
                        
                        let loadedRotation = item.rotation || 0;
                        if (!item.rotation && item.transform) {
                            const match = item.transform.match(/rotate\((\d+)deg\)/);
                            if (match) loadedRotation = parseInt(match[1]);
                        }

                        img.rotation = loadedRotation;
                        img.style.setProperty('--rot', `${loadedRotation}deg`);
                        
                        makeDraggable(img);
                        container.appendChild(img);
                        addedImages.push(img);
                        if (item.text) addTextOverImage(item.text, img);
                    });
                    updateEditableClasses(); // Sinkronkan UI awal
                }
            } catch (err) {}
        }

        toggleButtons.addEventListener('click', function() {
            buttonContainer.classList.toggle('visible');
            this.textContent = buttonContainer.classList.contains('visible') ? '×' : '+';
        });

        function addImage(src) {
            const img = document.createElement('img');
            img.src = src;
            img.className = 'draggable-image editable'; // Langsung editable karena pasti mode edit

            img.style.left = `50%`;
            img.style.top = `50%`;
            img.rotation = 0;
            img.style.setProperty('--rot', '0deg');
            
            makeDraggable(img);
            container.appendChild(img);
            addedImages.push(img);

            if (!['jacking.png', 'taildock.png', 'fuselagedock.png', 'bothdock.png'].includes(src)) {
                const textInput = document.createElement('input');
                textInput.type = 'text';
                textInput.placeholder = 'REG';
                textInput.className = 'text-input';
                textInput.style.position = 'absolute';
                textInput.style.left = img.style.left;
                textInput.style.top = img.style.top; 

                img.textInput = textInput; 

                textInput.addEventListener('keypress', async function(event) {
                    if (event.key === 'Enter') {
                        addTextOverImage(textInput.value, img);
                        container.removeChild(textInput); 
                        await saveToSupabase(); 
                        updateTimestamp(); 
                    }
                });
                container.appendChild(textInput);
                textInput.focus();
            }

            buttonContainer.classList.remove('visible');
            toggleButtons.textContent = '+';
            updateTimestamp(); 
            saveToSupabase(); 
        }

        function addTextOverImage(text, img) {
            const textElement = document.createElement('div');
            textElement.textContent = text;
            textElement.className = isEditAllowed ? 'text-element editable' : 'text-element';
            
            textElement.style.left = img.style.left;
            textElement.style.top = img.style.top; 

            textElement.addEventListener('click', function() {
                if (!isEditAllowed) return; // PROTEKSI KLIK TEKS

                const input = document.createElement('input');
                input.type = 'text';
                input.value = textElement.textContent;
                input.className = 'text-input';
                input.style.position = 'absolute';
                input.style.left = textElement.style.left;
                input.style.top = textElement.style.top;

                input.addEventListener('keypress', async function(event) {
                    if (event.key === 'Enter') {
                        textElement.textContent = input.value; 
                        container.appendChild(textElement); 
                        container.removeChild(input); 
                        await saveToSupabase();
                        updateTimestamp();
                    }
                });
                container.appendChild(input);
                input.focus(); 
                container.removeChild(textElement);
            });
            container.appendChild(textElement);
            img.textElement = textElement; 
        }

        function toggleEraser() {
            if (!isEditAllowed) return;

            eraserMode = !eraserMode;
            const btn = document.getElementById('eraserButton');
            
            btn.classList.toggle('active', eraserMode);
            if (eraserMode) {
                statusIndicator.textContent = "Mode: Hapus (Klik Pesawat)";
                statusIndicator.style.backgroundColor = "#c0392b";
                document.body.style.cursor = `url("data:image/svg+xml;utf8,<svg xmlns='http://w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%23e74c3c' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z'></path><line x1='18' y1='9' x2='12' y2='15'></line><line x1='12' y1='9' x2='18' y2='15'></line></svg>") 12 12, not-allowed`;
            } else {
                statusIndicator.textContent = "Mode: Normal / Edit";
                statusIndicator.style.backgroundColor = "rgba(0, 0, 0, 0.6)";
                document.body.style.cursor = "";
            }
        }

        function makeDraggable(element) {
            element.onmousedown = function(e) {
                if (!isEditAllowed) return; // PROTEKSI GESER PESAWAT

                if (eraserMode) {
                    if (confirm("Hapus pesawat ini?")) {
                        if (element.textElement) container.removeChild(element.textElement);
                        if (element.textInput) container.removeChild(element.textInput);
                        container.removeChild(element);
                        const index = addedImages.indexOf(element);
                        if (index > -1) addedImages.splice(index, 1);
                        updateTimestamp(); 
                        saveToSupabase(); 
                    }
                    return;
                }

                e.preventDefault();
                element.style.zIndex = '100';
                if(element.textElement) element.textElement.style.zIndex = '101';
                
                function moveImage(e) {
                    e.preventDefault();
                    
                    let x = e.clientX;
                    let y = e.clientY;

                    x = Math.max(0, Math.min(x, window.innerWidth));
                    y = Math.max(0, Math.min(y, window.innerHeight));

                    const xPercent = (x / window.innerWidth) * 100;
                    const yPercent = (y / window.innerHeight) * 100;

                    element.style.left = `${xPercent}%`;
                    element.style.top = `${yPercent}%`;

                    if (element.textElement) {
                        element.textElement.style.left = `${xPercent}%`;
                        element.textElement.style.top = `${yPercent}%`;
                    }
                }

                async function stopDragging() {
                    document.onmouseup = null;
                    document.onmousemove = null;
                    element.style.zIndex = '10';
                    if(element.textElement) element.textElement.style.zIndex = '15';
                    await saveToSupabase(); 
                    updateTimestamp(); 
                }

                document.onmousemove = moveImage;
                document.onmouseup = stopDragging;
            };

            // PROTEKSI PUTAR PESAWAT
            element.ondblclick = async function() {
                if (!isEditAllowed) return; 

                let currentRotation = element.rotation || 0; 
                currentRotation += 90; 
                if (currentRotation >= 360) currentRotation = 0; 
                
                element.rotation = currentRotation; 
                element.style.setProperty('--rot', `${currentRotation}deg`); 
                
                await saveToSupabase();
            };
        }

        window.onload = async function() {
            await loadFromSupabase();
            updateTimestamp(); 
        };
    </script>
</body>
</html>
